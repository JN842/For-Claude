    accessed: 2026-11-02
    fetched_ok: true
    notes: Securities table labelled 'Updated 16 Sep 2017'.
  - id: hkex_vcm_faq
    url: https://www.hkex.com.hk/Global/Exchange/FAQ/Securities-Market/Trading/VCM?sc_lang=en
    title: HKEX - Volatility Control Mechanism FAQ
    accessed: 2026-11-02
    fetched_ok: true
    notes: Page loaded but content was obtained through a summary, not verbatim.
  - id: hkex_fees
    url: https://www.hkex.com.hk/Services/Rules-and-Forms-and-Fees/Fees/Securities-(Hong-Kong)/Trading/Transaction?sc_lang=en
    title: HKEX - Securities Transaction Fees
    accessed: 2026-11-02
    fetched_ok: true
    notes: Page loaded but content was obtained through a summary, not verbatim.
  - id: hkex_severe_weather
    url: https://www.hkex.com.hk/Services/Trading-hours-and-Severe-Weather-Arrangements/Severe-Weather-Arrangements?sc_lang=en
    title: HKEX - Severe Weather Arrangements
