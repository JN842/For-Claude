# Hong Kong Exchanges and Clearing (securities market) - market rules registry.
# Times are local (Asia/Hong_Kong).
market: HKEX
exchange_name: Hong Kong Exchanges and Clearing - Securities Market
timezone: Asia/Hong_Kong
currency: HKD
registry_version: "2026.11.02-1"

sources:
  - id: hkex_cas_faq
    url: https://www.hkex.com.hk/Global/Exchange/FAQ/Securities-Market/Trading/CAS?sc_lang=en
    title: HKEX - Closing Auction Session FAQ
    accessed: 2026-11-02
    fetched_ok: true
    notes: Verbatim page text read. No last-updated date on the page.
  - id: hkex_trading_hours
    url: https://www.hkex.com.hk/Services/Trading-hours-and-Severe-Weather-Arrangements/Trading-Hours/Securities-Market?sc_lang=en
