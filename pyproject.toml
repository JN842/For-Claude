[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-alpha"
version = "0.1.0"
description = "Closing-auction alpha research platform for SET, SGX and HKEX (research and simulation only)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "plotly>=5.20",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["auction_alpha*"]

[tool.setuptools.package-data]
auction_alpha = ["rules/registry_data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
